<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- ValoSettings — grande icône (48 px et plus) : façade d'appareil + touche orange + LED -->
  <defs>
    <linearGradient id="chassis" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7F6F2"/>
      <stop offset="1" stop-color="#E2E0DA"/>
    </linearGradient>
    <linearGradient id="key" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7434"/>
      <stop offset="1" stop-color="#FF5B14"/>
    </linearGradient>
    <radialGradient id="led" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#E4FF3A" stop-opacity=".9"/>
      <stop offset="1" stop-color="#E4FF3A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- façade -->
  <rect x="14" y="20" width="228" height="226" rx="58" fill="#B9B7AF"/>
  <rect x="14" y="12" width="228" height="226" rx="58" fill="url(#chassis)"/>
  <rect x="16" y="14" width="224" height="222" rx="56" fill="none" stroke="#FFFFFF" stroke-opacity=".7" stroke-width="3"/>

  <!-- puits de la touche -->
  <rect x="50" y="52" width="156" height="160" rx="42" fill="#D3D1CA"/>

  <!-- touche orange (bord bas foncé = relief) -->
  <rect x="58" y="66" width="140" height="138" rx="36" fill="#C9410A"/>
  <rect x="58" y="58" width="140" height="136" rx="36" fill="url(#key)"/>
  <rect x="66" y="63" width="124" height="10" rx="5" fill="#FFFFFF" opacity=".22"/>

  <!-- point encre -->
  <circle cx="128" cy="126" r="23" fill="#141414"/>

  <!-- LED « connecté » -->
  <circle cx="211" cy="42" r="18" fill="url(#led)"/>
  <circle cx="211" cy="42" r="8" fill="#E4FF3A" stroke="#141414" stroke-opacity=".25" stroke-width="1.5"/>
</svg>
